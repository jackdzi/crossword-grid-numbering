_ > nanoagent.plugin.v0001.ManifestConfig:
id: crossword-grid-numbering
name: Crossword Grid Numbering
version: 0.2.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  get_grid:
    description: Get the task's crossword grid, as its rows and its columns ('.' white, '#' black), how many white runs it has, and the first batch of them, in reading order
  save_numbers:
    description: Save the numbers of one batch of up to 25 runs of get_grid's runs list (each run's clue number, or 0 for a single cell) into the workspace, and return every number saved so far, where the next batch starts, and the next batch of runs
  pin_numbering:
    description: Pin the grid and its correct numbering, the task's answer key

# One entry per contract.Task; its input class is contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  number-grid:
    description: Number a crossword grid's across and down entries by the standard rule, and save them
    runner: agent
    tools: [get_grid, save_numbers]
    reference: pin_numbering
    instructions: |-
      Rules. An entry is a run of 2 or more white cells, across or down; a run of 1 cell is no entry. Reading the grid row by row, left to right, each cell that starts at least one entry gets the next number, from 1. A cell that starts both an across and a down entry has one number, used by both.
      Plan. One tool call per step: (1) get_grid with the task input copied exactly: it gives the first batch of runs; (2) save_numbers with start 0 and one number per run of that batch; (3) while complete is false, save_numbers with start = next_start and one number per run of next_runs; then submit with the numbers the last save_numbers call returned. A grid needs at most three batches.
      Method. Never scan the grid yourself: the runs of each batch are given with their first cell and length, in reading order. Number only the batch in front of you, keeping last, the last number used (0 at the start; for a later batch, the last_number returned). For each run: if its length is 1, its number is 0. Otherwise, if the run just before it starts at the same cell and its number is above 0, it takes that same number. Otherwise last goes up by 1 and the run takes last. The rule has no exceptions: apply it without second-guessing, one short line per run, then call the tool.
